workflows:
  ios-release:
    name: iOS Release Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.topfilesLLC.Moneysent
    scripts:
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios && pod install
      - name: Apply provisioning profiles on Xcode workspace
        script: |
          set -e
          xcode-project use-profiles --workspace ios/Runner.xcworkspace
      - name: Build signed IPA
        script: |
          set -e
          flutter build ipa --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
