workflows:
  ios-release:
    name: iOS Release Build

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.topfilesLLC.Moneysent

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles --workspace ios/Runner.xcworkspace

      - name: Build signed IPA
        script: |
          flutter build ipa --export-method app-store

    artifacts:
      - build/ios/ipa/**/*.ipa
