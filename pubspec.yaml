name: moneysent
description: MoneySENT - Шуурхай шилжүүлгийн үйлчилгээ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  intl: ^0.19.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  crypto: ^3.0.6
  html: ^0.15.4
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  google_sign_in: ^6.2.2
  flutter_stripe: ^11.4.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFD400"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/blz_de.json
